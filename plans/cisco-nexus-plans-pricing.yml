specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Cisco Nexus Dashboard
providerId: cisco-nexus
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Data Center
  - Infrastructure
  - Network Automation
  - Networking
  - SDN
  - Switches
description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: cisco-nexus-free
    name: Free
    type: freemium
    description: Free entry tier for the Cisco Nexus Dashboard API surface. Intended for evaluation, prototyping,
      and low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://{switch-ip}/api
          - https://{switch-ip}/ins
          - https://{nexus-dashboard}/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndfc/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndo/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndi/api/v1
          - https://{dcnm-server}/rest
          - netconf://{switch-ip}:830
          - https://{switch-ip}/restconf
          - grpc://{switch-ip}:50051
          - https://{switch-ip}
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the free tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        geo: global
        domains:
          - https://{switch-ip}/api
          - https://{switch-ip}/ins
          - https://{nexus-dashboard}/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndfc/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndo/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndi/api/v1
          - https://{dcnm-server}/rest
          - netconf://{switch-ip}:830
          - https://{switch-ip}/restconf
          - grpc://{switch-ip}:50051
          - https://{switch-ip}
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Public Documentation
      - name: Community Support
      - name: Sandbox Access
      - name: Cisco NX-API REST
      - name: Cisco NX-API CLI
      - name: Cisco Nexus Dashboard REST API
      - name: Cisco Nexus Dashboard Fabric Controller API
      - name: Cisco Nexus Dashboard Orchestrator API
      - name: Cisco Nexus Dashboard Insights API
      - name: Cisco DCNM REST API
      - name: Cisco NETCONF/YANG API
  - id: cisco-nexus-pro
    name: Professional
    type: paid
    description: Production tier for Cisco Nexus Dashboard. Provides higher quotas, priority support,
      and access to the broader API portfolio. Pricing placeholder; align with the provider's pricing
      page.
    entries:
      - label: API Requests
        description: Monthly API request quota
        name: api_requests
        type: quota
        metric: requests
        limit: 100000
        timeFrame: month
        geo: global
        domains:
          - https://{switch-ip}/api
          - https://{switch-ip}/ins
          - https://{nexus-dashboard}/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndfc/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndo/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndi/api/v1
          - https://{dcnm-server}/rest
          - netconf://{switch-ip}:830
          - https://{switch-ip}/restconf
          - grpc://{switch-ip}:50051
          - https://{switch-ip}
        unit: 1
        price: TBD
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the professional tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 100
        timeFrame: minute
        geo: global
        domains:
          - https://{switch-ip}/api
          - https://{switch-ip}/ins
          - https://{nexus-dashboard}/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndfc/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndo/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndi/api/v1
          - https://{dcnm-server}/rest
          - netconf://{switch-ip}:830
          - https://{switch-ip}/restconf
          - grpc://{switch-ip}:50051
          - https://{switch-ip}
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Overage
        description: Per-request price after monthly quota is exceeded
        name: overage
        type: metered
        metric: requests
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://{switch-ip}/api
          - https://{switch-ip}/ins
          - https://{nexus-dashboard}/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndfc/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndo/api/v1
          - https://{nexus-dashboard}/appcenter/cisco/ndi/api/v1
