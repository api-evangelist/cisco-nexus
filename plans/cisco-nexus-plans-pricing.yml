description: Cisco Nexus Dashboard is the operational console for Cisco data center fabrics (NX-OS,
  ACI, Cloud Network Controller). Functionality is licensed via Cisco Data Center Networking software
  tiers (Essentials, Advantage, Premier) under Smart Licensing — typically tied to Nexus 9000 hardware
  purchases or subscription contracts. The REST and gRPC management APIs are unlocked by the parent
  software license rather than sold as a metered API.
