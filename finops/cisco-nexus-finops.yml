description: FOCUS-aligned FinOps shape for Cisco Nexus Dashboard and its NX-API / gRPC management
  surface. Cost is driven by Cisco Data Center Networking software subscriptions (Essentials /
  Advantage / Premier), Nexus 9000 hardware, and Cisco DC Power-of-Subscription term agreements —
  not by per-API metering.
notes: Per-API meters below are placeholders modeled on operational dimensions; real billing flows
  through Cisco DCN licensing line items, hardware POs, and Smart Licensing usage.
sources:
  - https://www.cisco.com/site/us/en/products/networking/cloud-networking/nexus-platform/index.html
  - https://www.cisco.com/c/en/us/products/software/dcn-software-subscriptions/index.html
billingModel:
  pricingCategory: Subscription + Perpetual License
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Cisco Nexus Dashboard
  ServiceCategory: Data Center Networking
  ProviderName: Cisco
  PublisherName: Cisco Systems, Inc.
  InvoiceIssuerName: Cisco Systems, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: dcn_software_license
    description: Cisco Data Center Networking software subscription (Essentials / Advantage / Premier)
      tied to Nexus switches.
    unit: license
    aggregation: sum
    dimensions:
      - tier
      - sku
      - term
      - region
  - name: nexus_switch_hardware
    description: Nexus 9000 / 7000 hardware purchases under support contract.
    unit: chassis
    aggregation: sum
    dimensions:
      - platform
      - region
  - name: nexus_dashboard_cluster
    description: Nexus Dashboard cluster footprint hosting Insights / Orchestrator / Fabric Controller.
    unit: cluster
    aggregation: max
    dimensions:
      - service
      - size
      - region
principles:
  - name: Visibility
    description: Use Cisco Smart Software Manager (CSSM) for license consumption and Nexus Dashboard
      Insights for fabric utilization and capacity reporting.
  - name: Allocation
    description: Allocate switch and DCN software cost to the network cost center; chargeback by
      tenant / VRF / fabric using Nexus Dashboard tenant separation.
  - name: Optimization
    description: Match DCN tier (Essentials / Advantage / Premier) to required features, retire
      under-utilized switches, and prefer streaming telemetry over REST polling.
  - name: Accountability
    description: Network platform owner is accountable for Nexus Smart License renewals, hardware
      refresh planning, and Nexus Dashboard scale targets.
maintainers:
